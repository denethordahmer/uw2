name: Syntax Check

on:
  push:
    paths:
      - '**.js'

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run syntax check on all JS files
        run: |
          echo "Checking JavaScript syntax..."
          # Find all .js files and check them
          find . -name "*.js" -not -path "./.git/*" | while read -r file; do
            echo "Checking $file..."
            node --check "$file"
            if [ $? -ne 0 ]; then
              echo "Syntax error found in $file"
              exit 1
            fi
          done
          echo "All JavaScript files passed the syntax check."
