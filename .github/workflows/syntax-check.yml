name: CI

# The filename is still syntax-check.yml on purpose: the zip upload flow copies
# over the tree without deleting, so renaming this file would leave the old
# workflow running on GitHub alongside the new one.
on:
  push:
    paths:
      - '**.js'
      - '**.html'
      - 'css/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'music/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Syntax, load order, regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript syntax error"
              fail=1
            fi
          done < <(find . -name '*.js' -not -path './.git/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "One or more files failed the syntax check."
            exit 1
          fi
          echo "All JavaScript files parsed."

      # js/manifest.js is the single declared load order. This asserts that
      # index.html and the files on disk still agree with it.
      - name: Load order and manifest consistency
        run: node tools/check-order.js

      # test_items.js runs the load-order guard first, then the 84 item checks.
      - name: Item + load-order regression suite
        run: node test_items.js

      - name: Stylesheet is present and linked
        shell: bash
        run: |
          set -euo pipefail
          test -f css/game.css || { echo "::error::css/game.css is missing"; exit 1; }
          grep -q 'css/game.css' index.html || { echo "::error::index.html does not link css/game.css"; exit 1; }
          echo "Stylesheet present and linked from index.html."

      # js/sfx.js owns the ward -> MP3 table. A renamed or missing upload would
      # only show up as silence on the phone, so fail the build instead.
      - name: Music beds are present
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("js/sfx.js", "utf8");
            const start = src.indexOf("MUSIC_TRACKS");
            const end = src.indexOf("const BGM_FADE_IN_MS");
            if (start < 0 || end < 0) { console.error("::error::MUSIC_TRACKS table not found in js/sfx.js"); process.exit(1); }
            const table = src.slice(start, end);
            const paths = (table.match(/"([^"]+\.mp3)"/g) || []).map(function(x){ return x.slice(1, -1); });
            if (!paths.length) { console.error("::error::No .mp3 paths in the MUSIC_TRACKS table"); process.exit(1); }
            let bad = 0;
            paths.forEach(function(p){
              if (!fs.existsSync(p) || fs.statSync(p).size === 0) {
                console.error("::error file=" + p + "::missing or empty music bed");
                bad++;
              }
            });
            if (bad) process.exit(1);
            console.log(paths.length + " music bed(s) present.");
          '
