name: Unzip

# Upload underward.zip to the repo root (any branch) and this unpacks it over the
# working tree, then commits the result. Rename the archive here and below if you
# ever change its filename.
on:
  push:
    paths:
      # Any .zip dropped at the TOP LEVEL of the repo. The filename doesn't
      # matter, so whatever your export command calls it will work - as long as
      # it is a zip and it lands at the repo root, not inside a folder.
      - '*.zip'
  # Lets you re-run by hand from the Actions tab without pushing a new zip.
  workflow_dispatch:

permissions:
  contents: write

# Two unpacks of the same branch must never race each other.
concurrency:
  group: "unzip-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job's own commit deletes underward.zip, and `paths` above matches a
    # deletion as well as an addition - so without this guard the workflow can
    # trigger itself. GITHUB_TOKEN pushes do not start new runs by default, which
    # is why it usually "works", but that is luck: swap in a PAT and it loops.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find the archive
        id: guard
        run: |
          set -euo pipefail
          COUNT=$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No .zip found at the repo root - nothing to unpack."
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::$COUNT zips at the repo root; using the first one."
            find . -maxdepth 1 -name '*.zip' -type f
          fi

          ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | sort | head -1)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Archive found: $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Unpack into a temp directory
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          rm -rf /tmp/payload && mkdir -p /tmp/payload

          # Record what the archive claims to be BEFORE extracting, so a failure
          # below can say what it actually received.
          echo "Archive: $ZIP"
          echo "Size: $(du -h "$ZIP" | cut -f1)"
          echo "Type: $(file -b "$ZIP" 2>/dev/null || echo unknown)"
          if ! unzip -l "$ZIP" > /tmp/ziplist.txt 2>/tmp/ziperr.txt; then
            echo "::error::The archive could not be read as a zip. It is corrupt, truncated or not a zip at all."
            echo "unzip said:"
            cat /tmp/ziperr.txt
            echo "First bytes:"
            head -c 16 "$ZIP" | od -An -tx1
            exit 1
          fi
          echo "Entries in archive: $(( $(wc -l < /tmp/ziplist.txt) - 3 ))"

          # -o overwrites; the payload dir is fresh so nothing stale survives.
          if ! unzip -q -o "$ZIP" -d /tmp/payload 2>/tmp/unziperr.txt; then
            echo "::error::Extraction failed."
            cat /tmp/unziperr.txt
            exit 1
          fi
          # unzip exits 1 on warnings too (e.g. unsupported extra fields), so
          # confirm something actually landed.
          if [ -z "$(ls -A /tmp/payload)" ]; then
            echo "::error::The archive extracted to nothing."
            exit 1
          fi

          # Find index.html rather than assuming a shape.
          #
          # The old logic descended only while the current level held EXACTLY ONE
          # entry. That broke the common phone case: a wrapped folder next to any
          # stray file (Thumbs.db, .DS_Store, a README, a second copy) gives two
          # entries, the loop gives up at the top level, no index.html is found,
          # and the job aborts in seconds without touching anything.
          #
          # Instead, look for the game directly, then up to six levels deep inside
          # folders, and pick the SHALLOWEST index.html. A wrapper folder name
          # never matters, and stray siblings are ignored because we no longer
          # require the level to contain a single entry.
          SRC=""
          if [ -f /tmp/payload/index.html ]; then
            SRC=/tmp/payload
          else
            # Bounded search: a depth limit keeps this cheap and makes a
            # pathological archive (node_modules, a nested git checkout)
            # impossible to pick up by accident.
            # Depth 6 rather than 3: exports sometimes wrap more than once
            # ("underward-main/" then "underward/"), and a wrapper deeper than
            # the search limit used to look identical to "no game here".
            # `|| true` keeps a missing match from tripping `set -e`.
            BEST=$(find /tmp/payload -maxdepth 6 -name index.html -type f \
                     -not -path '*/__MACOSX/*' \
                     -not -path '*/node_modules/*' \
                     -not -path '*/.git/*' \
                     -printf '%d\t%h\n' 2>/dev/null | sort -n | head -1 | cut -f2- || true)
            if [ -n "${BEST:-}" ]; then SRC="$BEST"; fi
          fi

          # Refuse to touch the repo unless the payload is recognisably the game.
          # index.html alone is not enough: the game also needs js/ and css/, so
          # a stray HTML page in an unrelated archive cannot be half-copied over
          # the repository.
          if [ -z "$SRC" ] || [ ! -f "$SRC/index.html" ] || [ ! -d "$SRC/js" ]; then
            echo "::error::No game found in the archive (need index.html AND js/ together) - refusing to copy anything."
            echo ""
            echo "=== WHY THIS FAILED ==="
            echo "The job searched the archive for a folder containing BOTH index.html"
            echo "and js/. Neither was found together. The full listing is above under"
            echo "'Entries in archive'; here is what is actually in the payload:"
            echo ""
            echo "--- top level ---"
            find /tmp/payload -mindepth 1 -maxdepth 1 -printf '%y %p\n' | sort | head -30
            echo ""
            echo "--- every index.html anywhere in it (if any) ---"
            find /tmp/payload -name index.html -type f 2>/dev/null | head -10
            echo ""
            echo "--- every directory that has a js/ in it (if any) ---"
            find /tmp/payload -name js -type d 2>/dev/null | head -10
            echo ""
            echo "Most likely causes:"
            echo "  * The zip contains only PART of the project (e.g. just js/, or just"
            echo "    a folder of screenshots) instead of the whole game folder."
            echo "  * index.html landed inside a subfolder other than a plain wrapper."
            echo "  * The upload was truncated, so only some entries extracted."
            exit 1
          fi

          echo "Content root: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Copy payload over the working tree
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          # tar rather than cp so dotfiles come across too.
          #
          # The excludes are not cosmetic:
          #   .git     - extracting a stale .git over the checkout corrupts the
          #              repository mid-job and the later commit/push fails
          #   .github  - an older copy of these workflows would replace themselves
          #   *.zip    - stops an archive nested inside itself from coming back
          tar -C "$SRC" \
            --exclude='./.git' --exclude='./.git/*' \
            --exclude='./.github' --exclude='./.github/*' \
            --exclude='./*.zip' \
            --exclude='./__MACOSX' --exclude='./__MACOSX/*' \
            -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -

          # The archive has served its purpose; dropping it keeps the repo small
          # and stops the same payload being unpacked twice.
          rm -f "$ZIP"

          # Fail loudly if the checkout was somehow damaged.
          git rev-parse --git-dir >/dev/null

      - name: Stage and show what changed
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail
          git add -A
          git status --short | head -60
          echo "---"
          echo "Changed paths: $(git status --porcelain | wc -l)"

      - name: Commit and push
        if: steps.guard.outputs.found == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Nothing to commit - the archive matched the repo."
            exit 0
          fi

          git commit -m "Unzip underward.zip"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed. Any .js changes will now be checked by the CI workflow."
